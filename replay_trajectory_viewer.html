/**
 * 计算行级 diff
 * 返回数组: [{ type: 'same'|'add'|'remove'|'modify', lineA?: string, lineB?: string }]
 */
function computeLineDiff(textA, textB) {
    const linesA = textA.split('\n');
    const linesB = textB.split('\n');

    const lcs = computeLCS(linesA, linesB);
    const result = [];

    let iA = 0, iB = 0, iL = 0;

    while (iA < linesA.length || iB < linesB.length) {
        const lcsLine = iL < lcs.length ? lcs[iL] : null;

        if (lcsLine !== null && iA < linesA.length && linesA[iA] === lcsLine && iB < linesB.length && linesB[iB] === lcsLine) {
            result.push({ type: 'same', lineA: linesA[iA], lineB: linesB[iB] });
            iA++; iB++; iL++;
        } else {
            const removeBlock = [];
            while (iA < linesA.length && (lcsLine === null || linesA[iA] !== lcsLine)) {
                removeBlock.push(linesA[iA]);
                iA++;
            }
            const addBlock = [];
            while (iB < linesB.length && (lcsLine === null || linesB[iB] !== lcsLine)) {
                addBlock.push(linesB[iB]);
                iB++;
            }

            const pairs = Math.min(removeBlock.length, addBlock.length);
            for (let p = 0; p < pairs; p++) {
                result.push({ type: 'modify', lineA: removeBlock[p], lineB: addBlock[p] });
            }
            for (let p = pairs; p < removeBlock.length; p++) {
                result.push({ type: 'remove', lineA: removeBlock[p] });
            }
            for (let p = pairs; p < addBlock.length; p++) {
                result.push({ type: 'add', lineB: addBlock[p] });
            }
        }
    }

    return result;
}

/**
 * 计算 LCS（最长公共子序列）
 */
function computeLCS(a, b) {
    const m = a.length, n = b.length;
    if (m * n > 500000) {
        return computeLCSSparse(a, b);
    }

    const dp = [];
    for (let i = 0; i <= m; i++) {
        dp[i] = new Uint16Array(n + 1);
    }

    for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
            dp[i][j] = a[i - 1] === b[j - 1]
                ? dp[i - 1][j - 1] + 1
                : Math.max(dp[i - 1][j], dp[i][j - 1]);
        }
    }

    const lcs = [];
    let i = m, j = n;
    while (i > 0 && j > 0) {
        if (a[i - 1] === b[j - 1]) {
            lcs.unshift(a[i - 1]);
            i--; j--;
        } else if (dp[i - 1][j] >= dp[i][j - 1]) {
            i--;
        } else {
            j--;
        }
    }
    return lcs;
}

/**
 * 稀疏 LCS（大数组优化）
 */
function computeLCSSparse(a, b) {
    const indexMap = new Map();
    b.forEach((line, j) => {
        if (!indexMap.has(line)) indexMap.set(line, []);
        indexMap.get(line).push(j);
    });

    const matches = [];
    a.forEach((line, i) => {
        const indices = indexMap.get(line);
        if (indices) {
            for (let k = indices.length - 1; k >= 0; k--) {
                matches.push([i, indices[k]]);
            }
        }
    });

    const stacks = [];
    const stackTops = [];
    const prevLinks = [];

    for (const [iA, iB] of matches) {
        let pos = stackTops.findIndex(v => v >= iB);
        if (pos === -1) pos = stackTops.length;

        if (pos > 0) prevLinks.push([iA, iB, stacks[pos - 1].length - 1]);
        else prevLinks.push([iA, iB, -1]);

        if (pos === stacks.length) {
            stacks.push([]);
            stackTops.push(iB);
        }
        stacks[pos].push([iA, iB]);
        stackTops[pos] = iB;
    }

    const result = [];
    if (stacks.length === 0) return result;

    let stackIdx = stacks.length - 1;
    let linkIdx = stacks[stackIdx].length - 1;

    while (stackIdx >= 0 && linkIdx >= 0) {
        const [iA] = stacks[stackIdx][linkIdx];
        result.unshift(a[iA]);

        if (stackIdx > 0) {
            for (let p = prevLinks.length - 1; p >= 0; p--) {
                if (prevLinks[p][0] === stacks[stackIdx][linkIdx][0] && prevLinks[p][2] >= 0) {
                    stackIdx--;
                    linkIdx = prevLinks[p][2];
                    break;
                }
            }
        } else {
            break;
        }
    }

    return result;
}

/**
 * 渲染行级 diff 到 HTML
 */
function renderDiffLines(diffLines, side) {
    let html = '';
    diffLines.forEach(d => {
        switch (d.type) {
            case 'same':
                html += escapeHtml(side === 'left' ? d.lineA : d.lineB) + '\n';
                break;
            case 'add':
                if (side === 'right') {
                    html += `<span class="diff-line-add">${escapeHtml(d.lineB)}</span>\n`;
                }
                break;
            case 'remove':
                if (side === 'left') {
                    html += `<span class="diff-line-remove">${escapeHtml(d.lineA)}</span>\n`;
                }
                break;
            case 'modify':
                if (side === 'left') {
                    html += renderInlineCharDiff(d.lineA, d.lineB, 'remove') + '\n';
                } else {
                    html += renderInlineCharDiff(d.lineB, d.lineA, 'add') + '\n';
                }
                break;
        }
    });
    return html;
}

/**
 * 字符级内联 diff
 */
function renderInlineCharDiff(current, other, type) {
    const cssClass = type === 'add' ? 'diff-char-add' : 'diff-char-remove';

    let prefixLen = 0;
    while (prefixLen < current.length && prefixLen < other.length && current[prefixLen] === other[prefixLen]) {
        prefixLen++;
    }
    let suffixLen = 0;
    while (suffixLen < current.length - prefixLen && suffixLen < other.length - prefixLen &&
           current[current.length - 1 - suffixLen] === other[other.length - 1 - suffixLen]) {
        suffixLen++;
    }

    const prefix = current.substring(0, prefixLen);
    const suffix = current.substring(current.length - suffixLen);
    const midCurrent = current.substring(prefixLen, current.length - suffixLen);
    const midOther = other.substring(prefixLen, other.length - suffixLen);

    const charLCS = computeLCS(midCurrent.split(''), midOther.split(''));
    const lcsSet = new Set();
    let lcsIdx = 0;
    for (let ci = 0; ci < midCurrent.length && lcsIdx < charLCS.length; ci++) {
        if (midCurrent[ci] === charLCS[lcsIdx]) {
            lcsSet.add(ci);
            lcsIdx++;
        }
    }

    let midHtml = '';
    for (let ci = 0; ci < midCurrent.length; ci++) {
        const ch = escapeHtml(midCurrent[ci]);
        if (lcsSet.has(ci)) {
            midHtml += ch;
        } else {
            midHtml += `<span class="${cssClass}">${ch}</span>`;
        }
    }

    return escapeHtml(prefix) + midHtml + escapeHtml(suffix);
}

/**
 * 获取 record 的请求消息列表（兼容多种数据格式）
 */
function getRecordMessages(record) {
    return record.messages || (record.raw_request && record.raw_request.messages) || [];
}

/**
 * 归一化 system 消息内容：剥离每次对话都会变化的易变字段，
 * 使配置指纹、消息对比不受其干扰。
 *
 * 目前处理：
 * - x-anthropic-billing-header 中的 cch=<hex> 值（每次对话随机）
 *
 * 后续如有新的易变字段，只需在此函数中追加替换规则。
 */
function normalizeSystemContent(content) {
    if (!content || typeof content !== 'string') return content;
    // 将 cch=<任意非分号字符> 替换为固定占位符，忽略每次对话的随机值
    return content.replace(/cch=[^;\s]*/g, 'cch=<normalized>');
}

/**
 * 计算请求配置指纹（system 消息 + tools 参数）
 * 用于区分不同配置的推理请求
 */
function computeConfigFingerprint(record) {
    const msgs = getRecordMessages(record);
    // 提取 system 消息内容并归一化（剥离易变字段）
    const systemMsg = msgs.find(m => m.role === 'system');
    const rawSystemContent = systemMsg
        ? (typeof systemMsg.content === 'string' ? systemMsg.content : JSON.stringify(systemMsg.content))
        : '';
    const systemContent = normalizeSystemContent(rawSystemContent);

    // 提取 tools 参数（取工具名称列表排序后拼接）
    const tools = record.tools
        || (record.raw_request && record.raw_request.tools)
        || [];
    const toolsNames = Array.isArray(tools)
        ? tools.map(t => t.function && t.function.name ? t.function.name : (t.name || '')).sort().join(',')
        : '';

    return `sys:${systemContent}|tools:${toolsNames}`;
}

/**
 * 构建记录关系图（仅连前后轮对话，配置组颜色区分）
 * 返回: { nodes: [], edges: [], roots: [], configGroupCount, configFingerprints }
 */
function buildRelationGraph(records) {
    const nodes = records.map((r, i) => ({
        idx: i,
        hasError: !!r.error,
        children: [],
        parents: [],
        configGroup: -1, // 待分配
        startTime: r.start_time || '' // 节点起始时间（用于时间轴横向定位）
    }));

    const edges = [];

    // 计算每个 record 的配置指纹并分配配置组（相同指纹 = 同一组）
    const configFingerprints = records.map(r => computeConfigFingerprint(r));
    const configGroupMap = new Map();
    let groupIndex = 0;
    configFingerprints.forEach((fp, i) => {
        if (!configGroupMap.has(fp)) {
            configGroupMap.set(fp, groupIndex++);
        }
        nodes[i].configGroup = configGroupMap.get(fp);
    });

    // 仅限前后轮对话连线：每个 record 只连接其直接前驱
    // 直接前驱 = 消息前缀最长且完全匹配的 record（排除跨轮连线）
    for (let j = 0; j < records.length; j++) {
        let bestParent = -1;
        let bestParentLen = 0;

        const childMsgs = getRecordMessages(records[j]);
        if (childMsgs.length === 0) continue;

        for (let i = 0; i < records.length; i++) {
            if (i === j) continue;

            const parentMsgs = getRecordMessages(records[i]);
            if (parentMsgs.length === 0) continue;
            if (childMsgs.length <= parentMsgs.length) continue;

            // 检查前 parentMsgs.length 条消息是否一致
            let match = true;
            for (let k = 0; k < parentMsgs.length; k++) {
                if (!messagesEqual(childMsgs[k], parentMsgs[k])) {
                    match = false;
                    break;
                }
            }

            // 只取最长匹配前缀作为直接前驱（保证只有前后轮连线，无跨轮连线）
            if (match && parentMsgs.length > bestParentLen) {
                bestParent = i;
                bestParentLen = parentMsgs.length;
            }
        }

        if (bestParent >= 0) {
            nodes[bestParent].children.push(j);
            nodes[j].parents.push(bestParent);
            edges.push({
                from: bestParent,
                to: j,
                configChanged: nodes[bestParent].configGroup !== nodes[j].configGroup,
                isSpawn: false,
                fromGroup: nodes[bestParent].configGroup,
                toGroup: nodes[j].configGroup
            });
        }
    }

    // 第二遍：对 orphan 记录（无 message prefix 匹配的父节点），尝试"时间回退"spawn 边
    // 场景：子 agent 被父 agent 通过 task/subagent 工具 spawn 出来，
    // 其系统消息和 messages 与父 agent 完全不同，无法通过前缀匹配找到 parent；
    // 但时间上紧接父 agent 的某次对话，所以用"时间在前的最近记录"作为 spawn 来源。
    for (let j = 0; j < records.length; j++) {
        if (nodes[j].parents.length > 0) continue;  // 已有 parent，跳过

        const childTime = new Date(records[j].start_time).getTime();
        if (isNaN(childTime)) continue;

        // 在所有 start_time < childTime 的记录中找最近的（任意 record 都可能是 spawn 来源）
        // 注意：子 agent 链的头节点虽然没有 prefix parent，但可能有 prefix children，
        // 这里不检查 children.length，否则子 agent 链的头部 spawn 边会丢失。
        // （真正的第一条根记录无 predecessor，bestSpawn 自然为 -1，由 if (bestSpawn>=0) 兜底）
        let bestSpawn = -1;
        let bestSpawnTime = -Infinity;
        for (let i = 0; i < records.length; i++) {
            if (i === j) continue;
            const t = new Date(records[i].start_time).getTime();
            if (isNaN(t) || t >= childTime) continue;
            if (t > bestSpawnTime) {
                bestSpawnTime = t;
                bestSpawn = i;
            }
        }

        if (bestSpawn >= 0) {
            nodes[bestSpawn].children.push(j);
            nodes[j].parents.push(bestSpawn);
            edges.push({
                from: bestSpawn,
                to: j,
                configChanged: nodes[bestSpawn].configGroup !== nodes[j].configGroup,
                isSpawn: true,
                fromGroup: nodes[bestSpawn].configGroup,
                toGroup: nodes[j].configGroup
            });
        }
    }

    // 找出根节点（没有父节点的节点）
    const roots = nodes.filter(n => n.parents.length === 0).map(n => n.idx);

    return { nodes, edges, roots, configGroupCount: groupIndex, configFingerprints };
}

/**
 * 比较两条消息是否相等（用于前后轮对话检测）
 * system 消息会先归一化（剥离 cch 等易变字段）再比较
 */
function messagesEqual(a, b) {
    if (a.role !== b.role) return false;

    let contentA = typeof a.content === 'string' ? a.content : JSON.stringify(a.content || '');
    let contentB = typeof b.content === 'string' ? b.content : JSON.stringify(b.content || '');

    // system 消息包含 billing header 中的易变字段，需归一化后再比较
    if (a.role === 'system') {
        contentA = normalizeSystemContent(contentA);
        contentB = normalizeSystemContent(contentB);
    }

    if (contentA !== contentB) return false;

    // 比较 tool_calls（如果存在）
    const tcA = a.tool_calls || [];
    const tcB = b.tool_calls || [];
    if (tcA.length !== tcB.length) return false;

    return true;
}

/**
 * 渲染 DAG 图（配置组颜色区分 + 前后轮连线）
 */
function renderDAG(graph) {
    const container = document.getElementById('dagContainer');
    const svg = document.getElementById('dagSvg');

    // 清空现有内容
    container.querySelectorAll('.dag-node').forEach(el => el.remove());
    container.querySelectorAll('.dag-legend').forEach(el => el.remove());
    container.querySelectorAll('.dag-time-axis').forEach(el => el.remove());
    svg.querySelectorAll('path').forEach(el => el.remove());
    // 清空旧 marker，准备动态创建
    const defs = svg.querySelector('defs');
    defs.innerHTML = '';

    if (graph.nodes.length === 0) {
        container.innerHTML = `<div class="analysis-empty">
            <div class="analysis-empty-icon">&#128202;</div>
            <div>没有数据可分析</div>
        </div>`;
        return;
    }

    // 为每种连线颜色动态创建箭头 marker
    const markerColors = [EDGE_SAME_CONFIG_COLOR, EDGE_DIFF_CONFIG_COLOR, EDGE_SPAWN_COLOR];
    // 不同配置组间连线也用各组的颜色 marker（用于节点边框高亮）
    for (let g = 0; g < graph.configGroupCount; g++) {
        markerColors.push(CONFIG_COLORS[g] || CONFIG_COLORS[0]);
    }
    markerColors.forEach(color => {
        const markerId = 'arrow-' + color.replace('#', '');
        const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
        marker.setAttribute('id', markerId);
        marker.setAttribute('markerWidth', '6');
        marker.setAttribute('markerHeight', '4');
        marker.setAttribute('refX', '5');
        marker.setAttribute('refY', '2');
        marker.setAttribute('orient', 'auto');
        const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        polygon.setAttribute('points', '0 0, 6 2, 0 4');
        polygon.setAttribute('fill', color);
        marker.appendChild(polygon);
        defs.appendChild(marker);
    });

    // 计算布局：横轴按 start_time 时间定位，纵轴按树形结构分行
    const layout = computeTimeLayout(graph);

    const nodeWidth = 36;
    const nodeHeight = 44;
    const verticalGap = 50;

    layout.positions.forEach((pos, idx) => {
        const node = graph.nodes[idx];
        const x = pos.x; // 时间比例计算得到的像素横坐标
        const y = pos.row * (nodeHeight + verticalGap) + 40;

        const configColor = CONFIG_COLORS[node.configGroup] || CONFIG_COLORS[0];

        // 构建节点 tooltip：配置组信息
        const fp = graph.configFingerprints[idx];
        const sysPart = (fp.split('|')[0] || '').replace('sys:', '');
        const toolsPart = (fp.split('|')[1] || '').replace('tools:', '');
        const tooltip = `配置组 ${node.configGroup + 1}\nSystem: ${truncate(sysPart, 80) || '(无)'}\nTools: ${toolsPart || '(无)'}`;

        const nodeEl = document.createElement('div');
        nodeEl.className = `dag-node ${node.hasError ? 'error' : 'normal'}`;
        nodeEl.style.left = `${x}px`;
        nodeEl.style.top = `${y}px`;
        nodeEl.style.borderColor = configColor;
        nodeEl.style.color = configColor;
        nodeEl.title = tooltip;
        nodeEl.innerHTML = `<div class="dag-node-label">
            <span class="dag-node-idx">#${idx + 1}</span>
            <span class="dag-node-status" style="color:${configColor}">${node.hasError ? 'Error' : 'OK'}</span>
        </div>`;
        nodeEl.onclick = () => jumpToRecord(idx);
        nodeEl.id = `dag-node-${idx}`;
        container.appendChild(nodeEl);

        // 存储位置信息用于绘制连线
        node._rightX = x + nodeWidth;           // 右侧（出边起点）
        node._leftX = x;                        // 左侧（入边终点）
        node._centerY = y + nodeHeight / 2;     // 垂直中心
        node._bottomX = x + nodeWidth / 2;      // 底部中心（分叉出边起点）
        node._bottomY = y + nodeHeight;         // 底部 Y 坐标
    });

    // 渲染连线（前后轮对话关系）
    // 分叉边：父节点底部 → 子节点左侧（从下方出发，视觉区分分叉）
    // 同边边：父节点右侧 → 子节点左侧（水平连接）
    graph.edges.forEach(edge => {
        const fromNode = graph.nodes[edge.from];
        const toNode = graph.nodes[edge.to];

        if (fromNode._rightX === undefined) return;

        const toX = toNode._leftX;          // 子节点左侧
        const toY = toNode._centerY;        // 子节点垂直中心

        // 判断是否为分叉或 spawn：父节点有多个子节点，或当前边是 spawn 边
        const isFork = graph.nodes[edge.from].children.length > 1;
        const isForkOrSpawn = isFork || edge.isSpawn;
        // 判断是否换行：父与子不在同一行
        const parentRow = fromNode._centerY;
        const childRow = toNode._centerY;
        const rowChanged = Math.abs(parentRow - childRow) > 1;

        let fromX, fromY, pathData;

        if (isForkOrSpawn && rowChanged) {
            // 分叉且换行：从父节点底部中心出发
            fromX = fromNode._bottomX;
            fromY = fromNode._bottomY;
            // 先向下延伸，再水平过渡，最后到达子节点左侧
            const dropY = fromY + 20;  // 向下延伸 20px
            const midX = (fromX + toX) / 2;
            pathData = `M${fromX},${fromY} L${fromX},${dropY} C${midX},${dropY} ${midX},${toY} ${toX},${toY}`;
        } else {
            // 同边或换行但不分叉：从父节点右侧出发
            fromX = fromNode._rightX;
            fromY = fromNode._centerY;
            const midX = (fromX + toX) / 2;
            pathData = `M${fromX},${fromY} C${midX},${fromY} ${midX},${toY} ${toX},${toY}`;
        }

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathData);

        if (edge.isSpawn) {
            // 子 agent spawn 边：紫色点划线（父 agent 通过 subagent/task 工具创建子 agent）
            path.setAttribute('stroke', EDGE_SPAWN_COLOR);
            path.setAttribute('stroke-width', '1.5');
            path.setAttribute('stroke-dasharray', '5,2,1,2');
            path.setAttribute('fill', 'none');
            path.setAttribute('marker-end', `url(#arrow-${EDGE_SPAWN_COLOR.replace('#', '')})`);
        } else if (edge.configChanged) {
            // 配置变更连线：橙色虚线（醒目提示 system 或 tools 参数不一致）
            path.setAttribute('stroke', EDGE_DIFF_CONFIG_COLOR);
            path.setAttribute('stroke-width', '2.5');
            path.setAttribute('stroke-dasharray', '6,3');
            path.setAttribute('fill', 'none');
            path.setAttribute('marker-end', `url(#arrow-${EDGE_DIFF_CONFIG_COLOR.replace('#', '')})`);
        } else {
            // 同配置连线：实线（前后轮对话配置一致）
            path.setAttribute('stroke', EDGE_SAME_CONFIG_COLOR);
            path.setAttribute('stroke-width', '2');
            path.setAttribute('fill', 'none');
            path.setAttribute('marker-end', `url(#arrow-${EDGE_SAME_CONFIG_COLOR.replace('#', '')})`);
        }

        svg.appendChild(path);
    });

    // 渲染颜色图例（右上角）
    const legendEl = document.createElement('div');
    legendEl.className = 'dag-legend';
    legendEl.style.cssText = 'position:absolute;bottom:10px;right:10px;background:rgba(30,41,59,0.92);border:1px solid var(--border-color);border-radius:8px;padding:12px 16px;font-size:11px;z-index:5;max-width:220px;';

    let legendHtml = '<div style="font-weight:700;color:var(--text-muted);margin-bottom:8px;letter-spacing:0.5px;">配置组颜色</div>';

    // 配置组颜色说明
    for (let g = 0; g < graph.configGroupCount; g++) {
        const color = CONFIG_COLORS[g] || CONFIG_COLORS[0];
        const count = graph.nodes.filter(n => n.configGroup === g).length;
        legendHtml += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
            <span style="width:12px;height:12px;border-radius:3px;background:${color};display:inline-block;"></span>
            <span style="color:var(--text-main);">配置组 ${g + 1} (${count} 条)</span>
        </div>`;
    }

    // 连线类型说明
    legendHtml += '<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border-color);">';
    legendHtml += `<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
        <span style="width:24px;height:2px;background:${EDGE_SAME_CONFIG_COLOR};display:inline-block;"></span>
        <span style="color:var(--text-main);">同配置前后轮</span>
    </div>`;
    legendHtml += `<div style="display:flex;align-items:center;gap:6px;">
        <span style="width:24px;height:0;border-top:2.5px dashed ${EDGE_DIFF_CONFIG_COLOR};display:inline-block;"></span>
        <span style="color:var(--text-main);">配置变更(Sys/Tools)</span>
    </div>`;
    legendHtml += `<div style="display:flex;align-items:center;gap:6px;margin-top:4px;">
        <span style="width:24px;height:0;border-top:1.5px dotted ${EDGE_SPAWN_COLOR};display:inline-block;"></span>
        <span style="color:var(--text-main);">子 Agent Spawn</span>
    </div>`;
    legendHtml += '</div>';

    legendEl.innerHTML = legendHtml;
    container.appendChild(legendEl);

    // 更新容器大小（横轴按时间像素位置取最大值，底部预留时间轴空间）
    const maxNodeX = Math.max(...layout.positions.map(p => p.x)) + nodeWidth;
    const maxRowTop = Math.max(...layout.positions.map(p => p.row)) * (nodeHeight + verticalGap) + 40;
    const axisY = maxRowTop + nodeHeight + 20; // 时间轴位于节点下方
    const maxX = maxNodeX + 80; // 右侧留白
    const maxY = axisY + 50; // 底部留白 + 时间轴高度
    container.style.width = `${Math.max(maxX, 400)}px`;
    container.style.height = `${Math.max(maxY, 300)}px`;

    // 渲染时间轴（仅在存在真实时间跨度时绘制）
    if (layout.maxSpread !== undefined && layout.maxTime > layout.minTime) {
        renderTimeAxis(container, layout, axisY);
    }
}

/**
 * 计算布局位置（时间布局：横轴按 start_time 时间比例定位，纵轴按树形结构分行）
 * - X 轴：按节点 start_time 解析为时间戳，做时间比例映射，并保证相邻节点（按时间排序）最小水平间距
 * - Y 轴：复用树形行号分配（单子同行、多子分行），边总是从较早时间指向较晚时间
 * 返回: { positions: [{ x, row }], minTime, maxTime, maxSpread, leftPad }
 */
function computeTimeLayout(graph) {
    const n = graph.nodes.length;
    const nodeWidth = 36;
    const minGap = nodeWidth + 20; // 56px，相邻节点最小水平间距，保证不重叠
    const leftPad = 40; // 左侧留白，与节点 y 起始偏移一致
    const positions = graph.nodes.map(() => ({ x: leftPad, row: -1 }));

    if (n === 0) {
        return { positions, totalRows: 0, minTime: 0, maxTime: 0 };
    }

    // 解析每个节点的时间戳；无效日期退化为 idx*1000ms（保证可排序且不重叠）
    const times = graph.nodes.map((node, i) => {
        const t = new Date(node.startTime).getTime();
        return isNaN(t) ? i * 1000 : t;
    });

    let minTime = Math.min(...times);
    let maxTime = Math.max(...times);

    if (n === 1) {
        positions[0].x = leftPad;
        positions[0].row = 0;
        return { positions, totalRows: 1, minTime, maxTime };
    }

    let timeRange = maxTime - minTime;
    // 时间跨度为 0（所有节点同一时刻）：退化为 1 避免 NaN，后续 minGap 间距自然展开
    if (timeRange === 0) timeRange = 1;

    // 按时间升序排序的节点索引（时间相同则按原索引稳定排序）
    const sortedIndices = times
        .map((t, i) => ({ t, i }))
        .sort((a, b) => a.t - b.t || a.i - b.i)
        .map(o => o.i);

    // 时间比例宽度基准：保证平均间距不小于 minGap，并预留 200px 余量
    const maxSpread = (n - 1) * minGap + 200;

    // 计算每个节点的时间比例 X（未经 minGap 修正）
    const rawX = {};
    for (const idx of sortedIndices) {
        rawX[idx] = (times[idx] - minTime) / timeRange * maxSpread;
    }

    // 从左到右遍历（按时间排序），保证相邻节点水平间距不小于 minGap
    // 时间相近甚至相同的节点会被等距推开，避免重叠
    for (let k = 1; k < sortedIndices.length; k++) {
        const prev = sortedIndices[k - 1];
        const cur = sortedIndices[k];
        if (rawX[cur] - rawX[prev] < minGap) {
            rawX[cur] = rawX[prev] + minGap;
        }
    }

    // 写入最终 X（加左侧留白）
    positions.forEach((pos, idx) => {
        pos.x = rawX[idx] + leftPad;
    });

    // Y 轴：按全局 start_time 顺序贪心分配行号
    // 保证时间在前的节点优先占上行，时间在后的节点依次往下排列
    const sortedByTime = graph.nodes
        .map((n, i) => i)
        .sort((a, b) => {
            const cmp = (graph.nodes[a].startTime || '').localeCompare(graph.nodes[b].startTime || '');
            return cmp !== 0 ? cmp : a - b; // 时间相同时保持原始顺序
        });

    let nextRow = 0;
    for (const nodeIdx of sortedByTime) {
        if (positions[nodeIdx].row !== -1) continue; // 已分配则跳过

        const node = graph.nodes[nodeIdx];

        if (node.parents.length === 0) {
            // 根节点：分配下一行
            positions[nodeIdx].row = nextRow++;
        } else {
            const parentIdx = node.parents[0];
            const parentRow = positions[parentIdx].row;
            // 获取父节点的所有子节点
            const siblings = graph.nodes[parentIdx].children;

            if (siblings.length === 1) {
                // 单子节点：检查配置是否变化
                const edgeToChild = graph.edges.find(e => e.from === parentIdx && e.to === nodeIdx);
                const configChanged = edgeToChild ? edgeToChild.configChanged : false;

                if (configChanged) {
                    // 配置变化：分配新行
                    positions[nodeIdx].row = nextRow++;
                } else {
                    // 配置未变化：与父节点同行（紧凑链式）
                    positions[nodeIdx].row = parentRow;
                }
            } else {
                // 多子节点（分叉）：按 start_time 排序，最早的子继承父行（如配置未变），其余分配新行
                const sortedSiblings = [...siblings].sort((a, b) => {
                    const ta = graph.nodes[a].startTime || '';
                    const tb = graph.nodes[b].startTime || '';
                    return ta.localeCompare(tb) || a - b;
                });

                if (sortedSiblings[0] === nodeIdx) {
                    // 最早发生的子节点：检查配置是否变化
                    const edgeToChild = graph.edges.find(e => e.from === parentIdx && e.to === nodeIdx);
                    const configChanged = edgeToChild ? edgeToChild.configChanged : false;

                    if (configChanged) {
                        // 配置变化：分配新行
                        positions[nodeIdx].row = nextRow++;
                    } else {
                        // 配置未变化：与父节点同行（延续主线）
                        positions[nodeIdx].row = parentRow;
                    }
                } else {
                    // 非第一个子节点：分配独立新行
                    positions[nodeIdx].row = nextRow++;
                }
            }
        }
    }

    // 安全兜底：处理未被分配的节点
    positions.forEach((pos, idx) => {
        if (pos.row === -1) pos.row = nextRow++;
    });

    return { positions, totalRows: nextRow, minTime, maxTime, maxSpread, leftPad };
}

/**
 * 渲染时间轴（位于节点下方，按 minTime~maxTime 均分刻度）
 * - 刻度像素位置遵循 computeTimeLayout 的线性时间映射（未经 minGap 修正）
 * - 刻度数量自适应宽度（4-6 个），避免标签重叠
 * - 复用 formatTime 格式化时间标签
 */
function renderTimeAxis(container, layout, axisY) {
    const { minTime, maxTime, maxSpread, leftPad } = layout;
    const timeRange = maxTime - minTime;

    // 刻度数量：按宽度自适应，保证每个标签有足够像素宽度
    const minTickSpacing = 130; // 单个刻度标签所需最小像素宽度
    let tickCount = Math.max(4, Math.min(6, Math.round(maxSpread / minTickSpacing)));
    if (tickCount < 2) tickCount = 2;

    const axisEl = document.createElement('div');
    axisEl.className = 'dag-time-axis';
    axisEl.style.cssText = `position:absolute;left:0;right:0;top:${axisY}px;height:24px;pointer-events:none;z-index:3;`;

    // 水平基线
    const lineEl = document.createElement('div');
    lineEl.style.cssText = 'position:absolute;left:0;right:0;top:0;height:1px;background:var(--border-color);opacity:0.6;';
    axisEl.appendChild(lineEl);

    for (let t = 0; t < tickCount; t++) {
        const ratio = tickCount === 1 ? 0 : t / (tickCount - 1);
        const tickTime = minTime + ratio * timeRange;
        const tickX = leftPad + ratio * maxSpread;

        // 刻度短线
        const tickEl = document.createElement('div');
        tickEl.style.cssText = `position:absolute;left:${tickX}px;top:0;width:1px;height:6px;background:var(--border-color);opacity:0.6;`;
        axisEl.appendChild(tickEl);

        // 刻度文字（复用 formatTime 格式化为本地时间）
        const labelEl = document.createElement('div');
        labelEl.style.cssText = `position:absolute;left:${tickX}px;top:8px;transform:translateX(-50%);font-size:10px;color:var(--text-muted);white-space:nowrap;`;
        labelEl.textContent = formatTime(tickTime);
        axisEl.appendChild(labelEl);
    }

    container.appendChild(axisEl);
}

/**
 * 更新统计信息（含配置组与配置变更统计）
 */
function updateAnalysisStats(graph) {
    const statsEl = document.getElementById('analysisStats');
    const errorCount = graph.nodes.filter(n => n.hasError).length;
    const rootCount = graph.roots.length;
    const edgeCount = graph.edges.length;
    const configChangedEdges = graph.edges.filter(e => e.configChanged).length;

    statsEl.innerHTML = `
        <div class="stat-item"><span>总记录:</span><span class="stat-value">${graph.nodes.length}</span></div>
        <div class="stat-item"><span>对话树:</span><span class="stat-value">${rootCount}</span></div>
        <div class="stat-item"><span>前后轮:</span><span class="stat-value">${edgeCount}</span></div>
        <div class="stat-item"><span>配置组:</span><span class="stat-value">${graph.configGroupCount}</span></div>
        <div class="stat-item"><span>配置变更:</span><span class="stat-value" style="color:${configChangedEdges > 0 ? EDGE_DIFF_CONFIG_COLOR : 'var(--success)'}">${configChangedEdges}</span></div>
        <div class="stat-item"><span>异常:</span><span class="stat-value" style="color: ${errorCount > 0 ? '#f87171' : 'var(--success)'}">${errorCount}</span></div>
    `;
}

/**
 * 跳转到指定记录
 */
function jumpToRecord(idx) {
    closeAnalysisModal();
    currentRecordIdx = idx;
    updateNav();
    scrollToRecord(idx);

    // 高亮 DAG 节点
    document.querySelectorAll('.dag-node').forEach(n => n.classList.remove('selected'));
    const nodeEl = document.getElementById(`dag-node-${idx}`);
    if (nodeEl) nodeEl.classList.add('selected');
}

// Keyboard Shortcuts
document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;

    if (e.key === 'Escape') {
        closeAnalysisModal();
        closeTrajectory();
    }

    if (currentRecords.length === 0) return;

    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); navigateRecord(-1); }
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); navigateRecord(1); }
});
</script>
